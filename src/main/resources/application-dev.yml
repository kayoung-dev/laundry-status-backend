# `dev` profile: the dev server (GCP VM, /opt/washon/dev/compose.yml), behind
# Caddy over HTTPS. Connection settings and secrets come from environment
# variables set by that compose file; see docs/DEPLOY.md.
server:
  # Caddy terminates TLS; trust its X-Forwarded-* headers so the app sees
  # the original https scheme and host.
  forward-headers-strategy: framework

washon:
  admin:
    session:
      secure-cookie: true
  mqtt:
    # Camera OCR frames over MQTT (dev.washon.machine.api.OcrMqttListener).
    # url/username/password/topic-prefix: WASHON_MQTT_* from the compose file.
    enabled: true
