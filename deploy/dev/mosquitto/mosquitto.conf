persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice

allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# Backend (inside the compose network only; no published port).
listener 1883
protocol mqtt

# Cameras, through Caddy: wss://<API_DOMAIN>/mqtt -> mosquitto:9001.
listener 9001
protocol websockets
